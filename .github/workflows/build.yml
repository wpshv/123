name: 打包 Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: 打包 exe
        run: pyinstaller --onefile --windowed --noconfirm --name dazhuankuai dazhuankuai.py

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: dazhuankuai-exe
          path: dist/dazhuankuai.exe
          if-no-files-found: error
